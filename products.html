<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#f8fbff">
<title>产品列表｜EVA AI MARKET</title>
<style>
:root{--blue:#1688ff;--navy:#0b2148;--red:#ff3150;--muted:#8090a8;--line:#e6eef7;--bg:#f7fbff}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#edf5fb;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Noto Sans SC",Arial,sans-serif;color:var(--navy);-webkit-font-smoothing:antialiased}
body{display:flex;justify-content:center}.app-container{width:100%;max-width:430px;min-height:100svh;background:#fff;padding-bottom:74px;box-shadow:0 0 42px rgba(26,83,145,.08)}
.eva-head{height:58px;padding:calc(8px + env(safe-area-inset-top)) 14px 8px;display:flex;align-items:center;justify-content:space-between;background:#fff}.eva-brand{display:flex;align-items:center;gap:8px;text-decoration:none;color:#10224b}.eva-logo{width:34px;height:34px}.eva-logo svg{width:34px;height:34px}.eva-brand b{display:block;font-size:15px;font-weight:950}.eva-brand small{display:block;margin-top:2px;font-size:7.5px;color:#8593a7;font-weight:700}.eva-head-actions{display:flex;gap:10px}.icon-btn{width:27px;height:27px;border:0;background:transparent;color:#17365e;padding:0;display:grid;place-items:center}.icon-btn svg{width:21px;height:21px}
.eva-search-wrap{padding:0 12px;margin-bottom:9px}.eva-search{height:40px;border:1px solid var(--line);border-radius:18px;background:#fff;display:flex;align-items:center;overflow:hidden;box-shadow:0 5px 14px rgba(35,89,146,.045)}.eva-search input{flex:1;min-width:0;border:0;outline:0;background:transparent;padding:0 13px;color:#26445f;font-size:11px}.eva-search input::placeholder{color:#9aa8ba}.eva-search button{width:40px;height:40px;border:0;background:transparent;color:#17365e;display:grid;place-items:center}.eva-search button svg{stroke:#17365e}
.chips-wrap{padding:0 12px 8px}.catalog-meta{display:flex;justify-content:space-between;align-items:center;padding:2px 2px 8px;color:#17345a;font-size:11px}.catalog-meta span{color:#8a99ad;font-size:9px}.chips{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}.chips button{flex:none;height:29px;padding:0 13px;border:1px solid #e3ecf6;border-radius:15px;background:#f7faff;color:#6f8097;font-size:9.5px;font-weight:800}.chips button.active{background:#e9f4ff;border-color:#cfe8ff;color:#1280f3}
.product-grid{display:grid;grid-template-columns:1fr;gap:8px;padding:0 12px 16px}.product-card{min-height:91px;padding:10px;border:1px solid #e4edf6;border-radius:13px;background:#fff;display:grid;grid-template-columns:54px minmax(0,1fr) auto;grid-template-rows:auto auto auto;column-gap:10px;align-items:center;box-shadow:0 5px 15px rgba(35,89,146,.05);position:relative}.product-top{grid-column:1;grid-row:1/4;display:block;margin:0}.product-logo{width:50px;height:50px;border-radius:12px;display:grid;place-items:center;font-size:24px;font-weight:950;background:#eef6ff;color:#1688ff;box-shadow:inset 0 0 0 1px #e4edf6}.product-logo.brand-openai{background:linear-gradient(145deg,#13a184,#08715f);color:#fff}.product-logo.brand-claude{background:linear-gradient(145deg,#fa9475,#e86449);color:#fff}.product-logo.brand-gemini{background:linear-gradient(145deg,#eef0ff,#f8f5ff);color:#675eff}.product-logo.brand-grok{background:#10151d;color:#fff}.product-logo.brand-aws{background:#f7fbff;color:#1d2f48;font-size:15px}.product-logo.brand-capcut{background:#111;color:#fff}.product-logo.brand-kiro{background:linear-gradient(145deg,#7357ff,#2d78ff);color:#fff}.heart{display:none}
.product-card h3{grid-column:2;grid-row:1;margin:0;color:#10224b;font-size:12px;font-weight:950;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.product-card .desc{grid-column:2;grid-row:2;color:#8190a5;font-size:8.7px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:205px}.product-card .price{grid-column:2;grid-row:3;color:var(--red);font-size:15px;font-weight:950;line-height:1}.product-card .price small{font-size:8px;color:#8a99ad;font-weight:700}.buy{grid-column:3;grid-row:1/4;width:86px;height:32px;border:0;border-radius:16px;background:linear-gradient(180deg,#2eabff,#1381f4);color:#fff;font-size:9.5px;font-weight:900;box-shadow:0 4px 10px rgba(16,126,239,.22)}.buy:disabled{opacity:.45;box-shadow:none}.notice{padding:18px;border:1px solid var(--line);border-radius:13px;background:#fff;color:#8090a8;font-size:11px;text-align:center}
.product-card:before{content:"热门";position:absolute;right:10px;top:6px;color:#ff4660;background:#fff0f3;border-radius:6px;padding:2px 5px;font-size:7px;font-weight:900}.product-card:nth-child(n+4):before{display:none}
.eva-bottom{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:430px;height:68px;padding-bottom:env(safe-area-inset-bottom);z-index:40;background:rgba(255,255,255,.98);border-top:1px solid #e7eef7;display:grid;grid-template-columns:repeat(5,1fr);box-shadow:0 -6px 18px rgba(34,85,140,.05)}.eva-bottom a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:#7e8ca0;text-decoration:none;font-size:9px}.eva-bottom a.active{color:#1684ff;font-weight:900}.eva-bottom a span{font-size:18px}.spider-orb{display:flex!important;width:auto!important;height:auto!important;margin:0!important;border:0!important;border-radius:0!important;background:transparent!important;box-shadow:none!important;color:#7e8ca0!important;font-size:0!important}.spider-orb:before{content:"▦";font-size:18px}.spider-orb:after{content:"产品";font-size:9px}
.drawer{display:none!important}
@media(max-width:370px){.product-grid{padding-left:9px;padding-right:9px}.eva-search-wrap,.chips-wrap{padding-left:9px;padding-right:9px}.buy{width:76px}.product-card .desc{max-width:170px}}
</style>
</head>
<body data-page="products">
<main class="app-container">
<header class="eva-head">
<a class="eva-brand" href="/">
<span class="eva-logo"><svg viewBox="0 0 64 64"><defs><linearGradient id="cg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#35b9ff"/><stop offset=".56" stop-color="#147fff"/><stop offset="1" stop-color="#065ce7"/></linearGradient></defs><path fill="url(#cg)" d="M11 18l9 7 7-14 6 14 12-10 5 26c-12 8-25 8-38 0z"/><path fill="#fff" opacity=".9" d="M16 31h32v4H16z"/><circle cx="11" cy="15" r="4" fill="#35b9ff"/><circle cx="28" cy="8" r="4" fill="#147fff"/><circle cx="47" cy="12" r="4" fill="#065ce7"/></svg></span>
<span><b>EVA AI MARKET</b><small>全球优质AI服务 · 一站式购买平台</small></span>
</a>
<div class="eva-head-actions">
<button class="icon-btn" aria-label="Search" onclick="document.getElementById('productSearch').focus()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg></button>
<button class="icon-btn" aria-label="Products" onclick="location.href='/products.html'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 4h2l2.4 11.2a2 2 0 002 1.6h7.8a2 2 0 002-1.5L21 8H7"/><circle cx="10" cy="20" r="1"/><circle cx="18" cy="20" r="1"/></svg></button>
</div>
</header>

<div class="eva-search-wrap"><div class="eva-search">
<input id="productSearch" type="text" placeholder="搜索 AI 产品、服务或品牌..." aria-label="Search products">
<button type="button" aria-label="Search"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg></button>
</div></div>

<div class="chips-wrap"><div class="catalog-meta"><b>完整产品目录</b><span id="catalogCount">加载中…</span></div><div class="chips">
<button class="active" data-cat="all">综合</button>
<button data-cat="ai">热门</button>
<button data-cat="cloud">云服务</button>
<button data-cat="creative">创意</button>
<button data-cat="tools">工具</button>
</div></div>

<section class="product-grid" id="productsGrid"><p class="notice">正在加载产品…</p></section>

<nav class="eva-bottom">
<a href="/"><span>⌂</span>首页</a>
<a class="active" href="/products.html"><span>▦</span>分类</a>
<a class="spider-orb" href="/products.html" aria-label="产品"></a>
<a href="/orders.html"><span>▤</span>订单</a>
<a href="/profile.html"><span>♙</span>我的</a>
</nav>
</main>

<aside class="drawer" id="drawer" hidden><div class="drawer-panel"><button id="drawerClose">×</button></div></aside>

<script>
document.addEventListener('DOMContentLoaded',()=>{
 const q=new URLSearchParams(location.search).get('q');
 if(q){const input=document.getElementById('productSearch');if(input)input.value=q}
});
</script>
<script src="/eva-mobile-flow.js?v=20260921-runtime4"></script>
<script src="/speed-insights.js" defer></script>
</body>
</html>
