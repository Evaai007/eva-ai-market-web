<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>客户支持｜EVA AI MARKET</title><style>*{box-sizing:border-box}body{margin:0;background:#edf5fb;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Arial;color:#10224b}main{max-width:430px;min-height:100svh;margin:auto;background:#fff;padding-bottom:72px}.top{height:52px;border-bottom:1px solid #edf2f7;display:flex;align-items:center;justify-content:center;position:relative}.top b{font-size:15px}.back{position:absolute;left:12px;border:0;background:#fff;font-size:24px;color:#17385d}.wrap{padding:12px}.new{border:1px solid #dfeaf4;border-radius:13px;padding:12px}.new h3{margin:0 0 10px;font-size:12px}.new input,.new textarea,.new select{width:100%;border:1px solid #dce7f1;border-radius:9px;padding:9px;font:inherit;font-size:10px;margin-bottom:8px;background:#fbfdff}.new textarea{height:80px;resize:vertical}.btn{width:100%;height:38px;border:0;border-radius:9px;background:#087cf3;color:#fff;font-size:10px;font-weight:900}.ticket{border:1px solid #e2ebf4;border-radius:13px;margin-top:10px;overflow:hidden}.thead{padding:11px;background:#f7fbff}.subject{font-size:11px;font-weight:900}.meta{font-size:8px;color:#8a9aac;margin-top:4px}.msgs{padding:10px;display:grid;gap:7px}.msg{padding:8px 9px;border-radius:9px;background:#f2f6fa;font-size:9px;line-height:1.55}.msg.admin{background:#eaf5ff}.who{font-size:8px;color:#6f8298;margin-bottom:3px;font-weight:800}.reply{display:flex;gap:6px;padding:9px;border-top:1px solid #edf2f7}.reply input{flex:1;border:1px solid #dce7f1;border-radius:8px;padding:7px;font-size:9px}.reply button{border:0;background:#087cf3;color:#fff;border-radius:8px;padding:0 10px;font-size:9px;font-weight:800}.empty{text-align:center;color:#91a0af;font-size:10px;padding:40px 5px}.error{color:#c44d5a;text-align:center;font-size:10px;padding:20px}.bottom{position:fixed;left:50%;bottom:0;transform:translateX(-50%);max-width:430px;width:100%;height:64px;background:#fff;border-top:1px solid #e5edf6;display:flex;justify-content:space-around;align-items:center}.bottom a{color:#8796aa;text-decoration:none;font-size:9px;text-align:center}.bottom a.active{color:#087cf3;font-weight:900}.bottom span{display:block;font-size:18px;margin-bottom:2px}</style></head><body><main><header class="top"><button class="back" onclick="history.back()">‹</button><b>客户支持</b></header><div class="wrap"><form class="new" id="newForm"><h3>提交新的支持请求</h3><input id="subject" maxlength="160" placeholder="主题，例如：订单交付问题" required><select id="category"><option value="">选择分类</option><option>订单</option><option>付款 / 充值</option><option>产品</option><option>账户</option><option>其他</option></select><textarea id="message" maxlength="4000" placeholder="请描述需要帮助的问题…" required></textarea><button class="btn">提交请求</button></form><section id="tickets"></section></div><nav class="bottom"><a href="/"><span>⌂</span>首页</a><a href="/categories.html"><span>▦</span>分类</a><a href="/products.html"><span>🛒</span>产品</a><a href="/orders.html"><span>▤</span>订单</a><a class="active" href="/profile.html"><span>♙</span>我的</a></nav></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>(async()=>{const root=document.getElementById('tickets'),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));try{const cfg=await fetch('/api/config').then(r=>r.json());const sb=supabase.createClient(cfg.url,cfg.anonKey,{auth:{persistSession:true,autoRefreshToken:true}});const {data:{session}}=await sb.auth.getSession();if(!session){location.replace('/login.html?next=/support.html');return}const load=async()=>{const r=await fetch('/api/support',{headers:{authorization:'Bearer '+session.access_token}}),b=await r.json();if(!r.ok)throw Error(b.error||'支持服务不可用');const msgs=new Map();(b.messages||[]).forEach(m=>{if(!msgs.has(m.ticket_id))msgs.set(m.ticket_id,[]);msgs.get(m.ticket_id).push(m)});root.innerHTML=(b.tickets||[]).length?(b.tickets||[]).map(t=>'<article class="ticket"><div class="thead"><div class="subject">'+esc(t.subject)+'</div><div class="meta">'+esc(t.category||'其他')+' · '+esc(t.status)+' · '+new Date(t.updated_at).toLocaleString('zh-CN')+'</div></div><div class="msgs">'+(msgs.get(t.id)||[]).map(m=>'<div class="msg '+(m.sender_type==='admin'?'admin':'')+'"><div class="who">'+(m.sender_type==='admin'?'客服':'我')+'</div>'+esc(m.message)+'</div>').join('')+'</div>'+(!['closed','resolved'].includes(t.status)?'<div class="reply"><input data-ticket="'+esc(t.id)+'" maxlength="4000" placeholder="继续留言"><button data-send="'+esc(t.id)+'">发送</button></div>':'')+'</article>').join(''):'<div class="empty">还没有支持请求。需要帮助时可以在上方提交。</div>';root.querySelectorAll('[data-send]').forEach(btn=>btn.onclick=async()=>{const input=root.querySelector('[data-ticket="'+btn.dataset.send+'"]');if(!input.value.trim())return;btn.disabled=true;const r=await fetch('/api/support',{method:'PATCH',headers:{'content-type':'application/json',authorization:'Bearer '+session.access_token},body:JSON.stringify({ticketId:btn.dataset.send,message:input.value.trim()})});btn.disabled=false;if(r.ok){input.value='';await load()}else{const b=await r.json();alert(b.error||'发送失败')}})};document.getElementById('newForm').onsubmit=async e=>{e.preventDefault();const button=e.currentTarget.querySelector('button');button.disabled=true;const r=await fetch('/api/support',{method:'POST',headers:{'content-type':'application/json',authorization:'Bearer '+session.access_token},body:JSON.stringify({subject:document.getElementById('subject').value.trim(),category:document.getElementById('category').value,message:document.getElementById('message').value.trim()})});button.disabled=false;if(r.ok){e.currentTarget.reset();await load()}else{const b=await r.json();alert(b.error||'提交失败')}};await load()}catch(e){root.innerHTML='<div class="error">'+esc(e.message||'支持服务暂时不可用')+'</div>'}})();</script></body></html>
