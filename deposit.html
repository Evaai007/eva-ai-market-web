*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#edf5fb;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Arial,sans-serif;color:#10224b}

.balance{margin:10px 12px;padding:13px 14px;border-radius:11px;background:linear-gradient(135deg,#148cff,#54b9ff);color:#fff}.balance small{display:block;font-size:9px;opacity:.85}.balance strong{font-size:22px}.networks{display:flex;gap:6px;padding:10px 12px 2px}.networks button{flex:1;height:29px;border:1px solid #e3ebf3;border-radius:15px;background:#f3f7fb;color:#6e8096;font-size:8px}.networks .active{background:#087cf3;color:#fff;border-color:#087cf3}.deposit-card{padding:13px}.qr{width:132px;height:132px;margin:8px auto;display:grid;place-items:center;border:1px solid #e5edf6;border-radius:10px;background:#fff}.label{display:block;font-size:9px;color:#61758d;margin:10px 0 5px}.input{width:100%;height:42px;border:1px solid #e5edf6;border-radius:8px;padding:0 10px;color:#183650;background:#fff}.address{display:flex;gap:6px}.address code{flex:1;min-width:0;padding:9px;border-radius:8px;background:#f7f9fc;border:1px solid #e6edf5;font-size:9px;overflow:hidden;text-overflow:ellipsis}.copy{border:0;border-radius:8px;background:#eef7ff;color:#087cf3;padding:0 10px}.submit{width:100%;height:42px;border:0;border-radius:7px;background:linear-gradient(#29adff,#0785ff);box-shadow:0 4px 0 #0762c6;color:#fff;font-weight:900;margin-top:12px}.history{padding:11px}.history h3{font-size:11px;margin:0 0 7px}.hrow{display:grid;grid-template-columns:1fr auto auto;gap:7px;padding:8px 0;border-top:1px solid #edf2f6;font-size:8px}
</style><link rel="stylesheet" href="/eva-reference-final.css?v=20260923-final11"><link rel="stylesheet" href="/eva-reference-exact.css?v=20260923-exact2"></head><body class="reference-deposit"><main class="app"><header class="top"><button class="back" onclick="history.back()">‹</button><b>充值余额</b></header><section class="balance"><small>当前余额</small><strong id="balance">US$ 0.00</strong></section><div class="networks"><button class="active" data-net="TRC20">TRC20</button><button data-net="ERC20">ERC20</button><button data-net="BEP20">BEP20</button><button data-net="SOLANA" disabled aria-disabled="true" title="Coming soon">SOLANA</button></div><section class="card deposit-card"><div class="qr" id="qr"></div><label class="label">充值地址</label><div class="address"><code id="address"></code><button id="copy" class="copy" type="button">复制</button></div><form id="form"><label class="label">充值金额 (USDT)</label><input class="input" id="amount" type="number" min="10" step="0.01" placeholder="Minimum 10 USDT" required><label class="label">Transaction ID (TXID)</label><input class="input" id="txid" autocomplete="off" required><button class="submit" type="submit">我已完成转账，提交 TXID</button></form></section><section class="card history"><h3>充值记录</h3><div id="history"><span class="notice">Loading…</span></div></section><p class="notice" id="notice"></p><nav class="bottom"><a href="/"><span>⌂</span>首页</a><a href="/categories.html"><span>▦</span>分类</a><a href="/checkout.html"><span>🛒</span>购物车</a><a href="/orders.html"><span>▤</span>订单</a><a href="/profile.html"><span>♙</span>我的</a></nav></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script><script>
const A={TRC20:'TJCFS6hDKsEnquGuvw43krk141QLvHnGbG',ERC20:'0x644ed89caecc120d3a3180e9f20a90d970cfa3e8',BEP20:'0x644ed89caecc120d3a3180e9f20a90d970cfa3e8',SOLANA:'6r4BGQ4KTcgCzeNwbWsx5v6qNLTwU92iESYNukSC9c6Y'};let net='TRC20',sb,session;const notice=document.getElementById('notice'),addr=document.getElementById('address'),qr=document.getElementById('qr');function renderNet(){addr.textContent=A[net];document.querySelectorAll('[data-net]').forEach(b=>b.classList.toggle('active',b.dataset.net===net));qr.innerHTML='';if(window.QRCode)new QRCode(qr,{text:A[net],width:120,height:120,colorDark:'#07111d',colorLight:'#fff'})}document.querySelectorAll('[data-net]').forEach(b=>b.onclick=()=>{if(b.disabled)return;net=b.dataset.net;renderNet()});document.getElementById('copy').onclick=()=>navigator.clipboard?.writeText(A[net]);renderNet();
async function api(path,opt={}){const r=await fetch(path,{...opt,headers:{'content-type':'application/json',authorization:'Bearer '+session.access_token,...(opt.headers||{})}});const b=await r.json().catch(()=>({}));if(!r.ok)throw new Error(b.error||'Request failed');return b}
async function load(){const w=await sb.from('wallets').select('balance_usd').eq('user_id',session.user.id).single();document.getElementById('balance').textContent='US$ '+Number(w.data?.balance_usd||0).toFixed(2);const d=await sb.from('deposits').select('amount_usdt,network,status,created_at').eq('user_id',session.user.id).order('created_at',{ascending:false}).limit(10);document.getElementById('history').innerHTML=(d.data||[]).map(x=>'<div class="hrow"><span>'+new Date(x.created_at).toLocaleDateString()+'</span><span>'+x.network+' · US$ '+Number(x.amount_usdt).toFixed(2)+'</span><span class="status '+x.status+'">'+x.status+'</span></div>').join('')||'<span class="notice">暂无充值记录</span>'}
(async()=>{try{const c=await fetch('/api/config').then(r=>r.json());sb=supabase.createClient(c.url,c.anonKey,{auth:{persistSession:true,autoRefreshToken:true}});({data:{session}}=await sb.auth.getSession());if(!session){location.replace('/login.html?next=/deposit.html');return}await load()}catch(e){notice.textContent=e.message}})();
document.getElementById('form').onsubmit=async e=>{e.preventDefault();const btn=e.submitter,orig=btn.textContent;try{btn.disabled=true;btn.textContent='Submitting…';if(!session.refresh_token)throw new Error('Please sign in again.');const amount=Number(document.getElementById('amount').value),tx=document.getElementById('txid').value.trim();const own=new Set([A.ERC20.toLowerCase(),A.TRC20.toLowerCase()]);const valid=!own.has(tx.toLowerCase())&&((net==='ERC20'||net==='BEP20')?/^0x[a-fA-F0-9]{64}$/.test(tx):/^[a-fA-F0-9]{64}$/.test(tx));if(amount<10||!valid)throw new Error('Enter at least 10 USDT and a valid completed-payment TXID.');const r=await fetch('/api/store',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action:'submit_deposit',refreshToken:session.refresh_token,amount,network:net,transaction_id:tx})});const b=await r.json().catch(()=>({}));if(!r.ok)throw new Error(b.error||'Deposit submission failed.');notice.textContent='Deposit submitted successfully. Pending verification.';e.target.reset();await load()}catch(err){notice.textContent=err.message}finally{btn.disabled=false;btn.textContent=orig}};
</script></body></html>
