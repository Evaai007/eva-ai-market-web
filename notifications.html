<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>通知｜EVA AI MARKET</title><style>*{box-sizing:border-box}body{margin:0;background:#edf5fb;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Arial;color:#10224b}main{max-width:430px;min-height:100svh;margin:auto;background:#fff;padding-bottom:72px}.top{height:52px;border-bottom:1px solid #edf2f7;display:flex;align-items:center;justify-content:center;position:relative}.top b{font-size:15px}.back{position:absolute;left:12px;border:0;background:#fff;font-size:24px;color:#17385d}.list{padding:10px 12px;display:grid;gap:8px}.notice{border:1px solid #e4ebf3;border-radius:13px;padding:12px;background:#fff}.notice.unread{background:#f5faff;border-color:#cfe6ff}.row{display:flex;gap:9px}.dot{width:8px;height:8px;border-radius:50%;background:#1684ff;margin-top:5px;flex:0 0 auto}.notice:not(.unread) .dot{background:#c8d3df}.title{font-size:11px;font-weight:900}.msg{font-size:10px;color:#60748b;line-height:1.6;margin-top:5px}.meta{font-size:8px;color:#9aa9b9;margin-top:7px}.read{margin-top:8px;border:0;background:#eaf5ff;color:#087cf3;border-radius:7px;padding:5px 9px;font-size:8px;font-weight:800}.empty{text-align:center;color:#91a0af;font-size:10px;padding:55px 10px}.error{text-align:center;color:#c44d5a;font-size:10px;padding:35px 10px}.bottom{position:fixed;left:50%;bottom:0;transform:translateX(-50%);max-width:430px;width:100%;height:64px;background:#fff;border-top:1px solid #e5edf6;display:flex;justify-content:space-around;align-items:center}.bottom a{color:#8796aa;text-decoration:none;font-size:9px;text-align:center}.bottom a.active{color:#087cf3;font-weight:900}.bottom span{display:block;font-size:18px;margin-bottom:2px}</style></head><body><main><header class="top"><button class="back" onclick="history.back()">‹</button><b>通知</b></header><section id="list" class="list"></section><nav class="bottom"><a href="/"><span>⌂</span>首页</a><a href="/categories.html"><span>▦</span>分类</a><a href="/products.html"><span>🛒</span>产品</a><a href="/orders.html"><span>▤</span>订单</a><a class="active" href="/profile.html"><span>♙</span>我的</a></nav></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>(async()=>{const list=document.getElementById('list'),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));try{const cfg=await fetch('/api/config').then(r=>r.json());const sb=supabase.createClient(cfg.url,cfg.anonKey,{auth:{persistSession:true,autoRefreshToken:true}});const {data:{session}}=await sb.auth.getSession();if(!session){location.replace('/login.html?next=/notifications.html');return}const load=async()=>{const r=await fetch('/api/notifications',{headers:{authorization:'Bearer '+session.access_token}}),b=await r.json();if(!r.ok)throw Error(b.error||'通知加载失败');const rows=b.notifications||[];list.innerHTML=rows.length?rows.map(n=>'<article class="notice '+(n.read_at?'':'unread')+'" data-id="'+esc(n.id)+'"><div class="row"><i class="dot"></i><div><div class="title">'+esc(n.title)+'</div><div class="msg">'+esc(n.message)+'</div><div class="meta">'+new Date(n.created_at).toLocaleString('zh-CN')+'</div>'+(n.read_at?'':'<button class="read" type="button">标记已读</button>')+'</div></div></article>').join(''):'<div class="empty">暂无通知</div>';list.querySelectorAll('.read').forEach(btn=>btn.onclick=async()=>{const card=btn.closest('.notice');const r=await fetch('/api/notifications',{method:'PATCH',headers:{'content-type':'application/json',authorization:'Bearer '+session.access_token},body:JSON.stringify({id:card.dataset.id})});if(r.ok)await load()})};await load()}catch(e){list.innerHTML='<div class="error">'+esc(e.message||'通知服务暂时不可用')+'</div>'}})();</script></body></html>
