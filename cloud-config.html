<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#f8fbff">
<title>云服务配置｜EVA AI MARKET</title>
<link rel="stylesheet" href="/eva-fresh-reference.css?v=20260923-fresh1">
<style>
*{box-sizing:border-box}html,body{margin:0}.cfg{width:100%;max-width:430px;min-height:100svh;margin:auto;background:#f8fbfe;padding:calc(10px + env(safe-area-inset-top)) 14px 90px;color:#10224b}.top{height:42px;display:flex;align-items:center;justify-content:center;position:relative;background:#fff;border-radius:14px;margin-bottom:10px}.back{position:absolute;left:10px;width:30px;height:30px;border:0;background:#fff;color:#18375c;font-size:22px}.top b{font-size:15px}.summary,.card{background:#fff;border:1px solid #e5edf6;border-radius:14px;box-shadow:0 7px 18px rgba(38,91,149,.05)}.summary{display:flex;gap:10px;align-items:center;padding:11px;margin-bottom:12px}.logo{width:48px;height:48px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(145deg,#2aa8ff,#087cf3);color:#fff;font-size:26px;font-weight:900}.summary b{font-size:13px}.summary small{display:block;color:#8a99ad;font-size:9px;margin-top:3px}.steps{display:flex;align-items:center;justify-content:center;gap:6px;margin:7px 0 14px}.step{display:flex;align-items:center;gap:4px;color:#9aa8bb;font-size:9px}.step i{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;background:#eaf0f6;font-style:normal}.step.active{color:#087cf3}.step.active i{background:#087cf3;color:#fff}.line{width:34px;height:1px;background:#dce6ef}.card{padding:13px;margin-bottom:11px}.card h3{font-size:12px;margin:0 0 9px}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.choice{border:1px solid #dfe8f2;border-radius:10px;background:#fff;min-height:46px;padding:8px 5px;text-align:center;color:#4e6680;font-size:9px}.choice.active{border-color:#087cf3;background:#f3f9ff;color:#087cf3;font-weight:900}.choice b{display:block;color:inherit;font-size:10px}.choice small{font-size:8px;color:#8b99ad}.duration .choice{min-height:42px}.total{display:flex;justify-content:space-between;align-items:center;margin:16px 2px 10px}.total span{font-size:11px}.total b{font-size:22px;color:#f43650}.cta{width:100%;height:44px;border:0;border-radius:22px;background:linear-gradient(180deg,#19a7ff,#087cf3);color:#fff;font-weight:950;box-shadow:0 5px 0 #0562c7}.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;height:66px;background:#fff;border-top:1px solid #e5edf6;display:flex;justify-content:space-around;align-items:center}.bottom a{color:#8796aa;text-decoration:none;font-size:9px;text-align:center}.bottom span{display:block;font-size:18px;margin-bottom:2px}
</style>
</head>
<body>
<main class="cfg">
<div class="top"><button class="back" onclick="history.back()">‹</button><b>确认订单</b></div>
<section class="summary"><div class="logo" id="cfgLogo">☁</div><div><b id="cfgName">云服务</b><small id="cfgSub">高性能云服务 · 简单可靠</small></div></section>
<div class="steps"><span class="step active"><i>1</i>配置</span><i class="line"></i><span class="step"><i>2</i>确认</span><i class="line"></i><span class="step"><i>3</i>支付</span></div>
<section class="card"><h3>选择地区</h3><div class="choices" id="regions"><button class="choice active" type="button"><b>纽约 (US)</b><small>推荐</small></button><button class="choice" type="button"><b>新加坡 (SG)</b><small>低延迟</small></button><button class="choice" type="button"><b>法兰克福 (DE)</b><small>欧洲</small></button></div></section>
<section class="card"><h3>选择配置</h3><div class="choices" id="configs"><button class="choice" type="button"><b>2GB / 1 vCPU</b><small>基础配置</small></button><button class="choice active" type="button"><b>4GB / 2 vCPU</b><small>推荐配置</small></button><button class="choice" type="button"><b>8GB / 4 vCPU</b><small>高性能</small></button></div></section>
<section class="card duration"><h3>购买时长</h3><div class="choices" id="durations"><button class="choice active" type="button"><b>1个月</b></button><button class="choice" type="button"><b>3个月</b></button><button class="choice" type="button"><b>12个月</b></button></div></section>
<div class="total"><span>预计费用</span><b id="cfgPrice">US$ —</b></div>
<button class="cta" id="continueBtn" type="button">继续购物 →</button>
<nav class="bottom"><a href="/"><span>⌂</span>首页</a><a href="/categories.html"><span>▦</span>分类</a><a href="/checkout.html"><span>🛒</span>购物车</a><a href="/dashboard.html#customer-orders"><span>▤</span>订单</a><a href="/dashboard.html#overview"><span>♙</span>我的</a></nav>
</main>
<script>
(()=>{const q=new URLSearchParams(location.search),id=q.get('id');let p=null;const set=x=>{p=x;document.getElementById('cfgName').textContent=x.name||'云服务';document.getElementById('cfgSub').textContent=x.subtitle||x.category||'高性能云服务 · 简单可靠';document.getElementById('cfgPrice').textContent='US$ '+Number(x.price_usd||0).toFixed(2);try{sessionStorage.setItem('eva-checkout-product',JSON.stringify(x))}catch{}};try{const c=JSON.parse(sessionStorage.getItem('eva-checkout-product'));if(c&&String(c.id)===String(id))set(c)}catch{};if(!p&&id)fetch('/api/store',{cache:'no-store'}).then(r=>r.json()).then(b=>{const x=(b.products||[]).find(v=>String(v.id)===String(id));if(x)set(x)}).catch(()=>{});document.querySelectorAll('.choices').forEach(g=>g.addEventListener('click',e=>{const b=e.target.closest('.choice');if(!b)return;g.querySelectorAll('.choice').forEach(x=>x.classList.remove('active'));b.classList.add('active')}));document.getElementById('continueBtn').onclick=()=>{if(!p||!p.id)return;location.href='/checkout.html?id='+encodeURIComponent(p.id)}})();
</script>
</body></html>
