<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#f8fbff">
<title>找回密码｜EVA AI MARKET</title>
<style>
:root{--blue:#1688ff;--navy:#0b2148;--muted:#8190a5;--line:#e4edf6}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#edf5fb;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Noto Sans SC",Arial,sans-serif;color:var(--navy);-webkit-font-smoothing:antialiased}
body{display:flex;justify-content:center}.app{width:100%;max-width:430px;min-height:100svh;background:linear-gradient(180deg,#fbfdff,#f4f9fd 72%,#fff);padding:calc(20px + env(safe-area-inset-top)) 18px 28px;box-shadow:0 0 42px rgba(26,83,145,.08)}
.back{width:34px;height:34px;border:0;background:#fff;border-radius:10px;color:#17365e;font-size:22px;box-shadow:0 5px 14px rgba(35,89,146,.06)}
.brand{text-align:center;margin-top:18px}.logo{width:66px;height:66px;margin:0 auto 10px;display:grid;place-items:center}.logo svg{width:66px;height:66px}.brand h1{margin:0;font-size:21px;font-weight:950}.brand p{margin:6px 0 0;font-size:9.5px;color:#8190a5}
.card{margin-top:22px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px 15px 16px;box-shadow:0 10px 28px rgba(35,89,146,.07)}
.card h2{margin:0;font-size:17px;font-weight:950}.lead{margin:5px 0 15px;font-size:9.5px;color:#8190a5;line-height:1.5}
.field{margin-bottom:12px}.field label{display:block;margin-bottom:6px;font-size:9.5px;font-weight:900;color:#36506f}.field input{width:100%;height:43px;border:1px solid #dfe8f2;border-radius:11px;background:#fbfdff;padding:0 12px;outline:0;color:#17365e;font-size:11px}.field input:focus{border-color:#1688ff;box-shadow:0 0 0 3px rgba(22,136,255,.08)}
.cta{width:100%;height:44px;border:0;border-radius:12px;background:linear-gradient(180deg,#2baaff,#117df0);color:#fff;font-size:12px;font-weight:950;box-shadow:0 6px 14px rgba(10,119,236,.22)}.cta:disabled{opacity:.5;box-shadow:none}
#status{min-height:18px;margin-top:11px;text-align:center;font-size:9px;color:#7e8da1;line-height:1.45}
.links{text-align:center;margin-top:14px;font-size:9.5px}.links a{color:#1688ff;text-decoration:none;font-weight:900}
.help{margin-top:15px;padding:11px 12px;border:1px solid #e5edf6;border-radius:11px;background:#f8fbff;color:#76869b;font-size:8.5px;line-height:1.55}.help b{color:#17365e}
.safe{margin-top:12px;display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.safe div{height:50px;border:1px solid #e5edf6;border-radius:10px;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#7e8da1;font-size:7.5px}.safe b{color:#1688ff;font-size:14px;margin-bottom:2px}
@media(max-width:370px){.app{padding-left:14px;padding-right:14px}.card{padding-left:13px;padding-right:13px}}
</style>
</head>
<body>
<main class="app">
<button class="back" onclick="history.back()" aria-label="Back">‹</button>

<section class="brand">
<div class="logo"><svg viewBox="0 0 64 64"><defs><linearGradient id="cg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#35b9ff"/><stop offset=".56" stop-color="#147fff"/><stop offset="1" stop-color="#065ce7"/></linearGradient></defs><path fill="url(#cg)" d="M11 18l9 7 7-14 6 14 12-10 5 26c-12 8-25 8-38 0z"/><path fill="#fff" opacity=".9" d="M16 31h32v4H16z"/><circle cx="11" cy="15" r="4" fill="#35b9ff"/><circle cx="28" cy="8" r="4" fill="#147fff"/><circle cx="47" cy="12" r="4" fill="#065ce7"/></svg></div>
<h1>EVA AI MARKET</h1>
<p>全球优质AI服务 · 一站式购买平台</p>
</section>

<section class="card">
<h2>找回密码</h2>
<p class="lead">输入您的账户邮箱，我们会发送安全的密码重置链接。</p>

<form id="form">
<div class="field">
<label for="email">邮箱地址</label>
<input id="email" type="email" autocomplete="email" inputmode="email" required placeholder="you@example.com">
</div>
<button class="cta" id="sendBtn" type="submit">发送重置链接</button>
</form>

<div id="status" role="status" aria-live="polite"></div>
<div class="links"><a href="/login.html">‹ 返回登录</a></div>

<div class="help"><b>提示：</b>请检查收件箱和垃圾邮件文件夹。重置链接会跳转到 EVA AI MARKET 的安全密码重置页面。</div>
<div class="safe"><div><b>▣</b>安全链接</div><div><b>✉</b>邮件重置</div><div><b>◇</b>账户保护</div></div>
</section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
let c;const s=document.getElementById('status'),btn=document.getElementById('sendBtn');
(async()=>{
 try{
   const r=await fetch('/api/config',{cache:'no-store'});
   const x=await r.json();
   if(!r.ok)throw new Error(x.error||'Configuration unavailable');
   c=supabase.createClient(x.url,x.anonKey);
 }catch(e){s.textContent='Account service unavailable.'}
})();
document.getElementById('form').addEventListener('submit',async e=>{
 e.preventDefault();if(!c)return;
 const email=document.getElementById('email').value.trim().toLowerCase();
 if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){s.textContent='请输入有效的邮箱地址。';return}
 btn.disabled=true;btn.textContent='正在发送…';s.textContent='正在发送安全重置链接…';
 try{
   const {error}=await c.auth.resetPasswordForEmail(email,{redirectTo:location.origin+'/reset-password.html'});
   s.textContent=error?(error.message||'发送失败，请稍后重试。'):'重置邮件已发送，请检查您的收件箱。';
 }catch(err){s.textContent=err.message||'发送失败，请稍后重试。'}
 finally{btn.disabled=false;btn.textContent='发送重置链接'}
});
</script>
<script src="/speed-insights.js" defer></script>
</body>
</html>
