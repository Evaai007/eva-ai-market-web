<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>我的收藏｜EVA AI MARKET</title><style>*{box-sizing:border-box}body{margin:0;background:#edf5fb;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Arial;color:#10224b}main{max-width:430px;min-height:100svh;margin:auto;background:#fff;padding-bottom:75px}.top{height:52px;display:flex;align-items:center;justify-content:center;border-bottom:1px solid #eef3f8;position:relative}.back{position:absolute;left:12px;border:0;background:#fff;font-size:24px;color:#17385d}.top b{font-size:15px}.list{padding:12px;display:grid;gap:9px}.item{border:1px solid #e2ebf4;border-radius:13px;padding:12px;display:flex;align-items:center;gap:10px}.icon{width:44px;height:44px;border-radius:11px;background:#eef7ff;color:#087cf3;display:grid;place-items:center;font-weight:900}.info{flex:1;min-width:0}.name{font-size:11px;font-weight:900}.cat{font-size:8px;color:#8493a6;margin-top:4px}.price{font-size:11px;color:#e0445b;font-weight:900;margin-top:4px}.open{border:0;border-radius:8px;background:#087cf3;color:#fff;height:30px;padding:0 10px;font-size:9px;font-weight:900}.empty{text-align:center;padding:55px 15px;color:#8c9aac;font-size:10px}.empty a{color:#087cf3;text-decoration:none}.notice{margin:10px 12px;color:#75879c;font-size:9px}.bottom{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:430px;height:64px;background:#fff;border-top:1px solid #e5edf6;display:flex;justify-content:space-around;align-items:center}.bottom a{color:#8796aa;text-decoration:none;font-size:9px;text-align:center}.bottom a.active{color:#087cf3;font-weight:900}.bottom span{display:block;font-size:18px;margin-bottom:2px}</style></head><body><main><header class="top"><button class="back" onclick="history.back()">‹</button><b>我的收藏</b></header><p id="notice" class="notice">正在加载…</p><section id="list" class="list"></section><nav class="bottom"><a href="/"><span>⌂</span>首页</a><a href="/categories.html"><span>▦</span>分类</a><a href="/products.html"><span>🛒</span>产品</a><a href="/orders.html"><span>▤</span>订单</a><a class="active" href="/profile.html"><span>♙</span>我的</a></nav></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>(async()=>{const list=document.getElementById('list'),notice=document.getElementById('notice'),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));try{const c=await fetch('/api/config').then(r=>r.json());const sb=supabase.createClient(c.url,c.anonKey,{auth:{persistSession:true,autoRefreshToken:true}});const {data:{session}}=await sb.auth.getSession();if(!session){location.replace('/login.html?next=/favorites.html');return}const r=await fetch('/api/favorites',{headers:{authorization:'Bearer '+session.access_token}});const b=await r.json();if(!r.ok)throw Error(b.error||'收藏服务不可用');const ids=(b.favorites||[]).map(x=>x.product_id);if(!ids.length){notice.textContent='';list.innerHTML='<div class="empty">暂无收藏产品。<br><br><a href="/products.html">浏览真实产品</a></div>';return}const q=await sb.from('store_products').select('id,name,category,price_usd').in('id',ids).eq('active',true);if(q.error)throw q.error;const map=new Map((q.data||[]).map(x=>[x.id,x]));list.innerHTML=ids.map(id=>map.get(id)).filter(Boolean).map(p=>'<article class="item"><div class="icon">AI</div><div class="info"><div class="name">'+esc(p.name)+'</div><div class="cat">'+esc(p.category)+'</div><div class="price">$'+Number(p.price_usd||0).toFixed(2)+'</div></div><button class="open" data-id="'+esc(p.id)+'">查看</button></article>').join('');document.querySelectorAll('.open').forEach(x=>x.onclick=()=>location.href='/product.html?id='+encodeURIComponent(x.dataset.id));notice.textContent=ids.length+' 个收藏产品';}catch(e){notice.textContent='收藏暂时无法加载：'+e.message;list.innerHTML='<div class="empty">请稍后重试。</div>'}})();</script></body></html>
