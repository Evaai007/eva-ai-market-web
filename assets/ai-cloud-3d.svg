<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420">
<defs>
 <radialGradient id="bg" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#17246d" stop-opacity=".5"/><stop offset="1" stop-color="#080b25" stop-opacity="0"/></radialGradient>
 <linearGradient id="cloud" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#58c8ff"/><stop offset=".45" stop-color="#4a69ff"/><stop offset="1" stop-color="#702bd4"/></linearGradient>
 <radialGradient id="shine" cx=".3" cy=".18" r=".7"><stop offset="0" stop-color="#fff" stop-opacity=".48"/><stop offset=".22" stop-color="#a9ddff" stop-opacity=".18"/><stop offset="1" stop-color="#2b2d8f" stop-opacity="0"/></radialGradient>
 <linearGradient id="ring" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ff36d7"/><stop offset=".5" stop-color="#9a4cff"/><stop offset="1" stop-color="#46b8ff"/></linearGradient>
 <linearGradient id="base" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff30d4"/><stop offset=".5" stop-color="#4e68ff"/><stop offset="1" stop-color="#18c8ff"/></linearGradient>
 <filter id="glow"><feGaussianBlur stdDeviation="9" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <filter id="shadow"><feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#201c92" flood-opacity=".55"/></filter>
</defs>
<ellipse cx="290" cy="205" rx="200" ry="160" fill="url(#bg)"/>
<g filter="url(#shadow)">
 <circle cx="215" cy="205" r="82" fill="url(#cloud)" stroke="#8bc8ff" stroke-opacity=".45"/>
 <circle cx="300" cy="155" r="108" fill="url(#cloud)" stroke="#9ac8ff" stroke-opacity=".5"/>
 <circle cx="375" cy="215" r="86" fill="url(#cloud)" stroke="#9ac8ff" stroke-opacity=".45"/>
 <circle cx="282" cy="230" r="110" fill="url(#cloud)" stroke="#8bbcff" stroke-opacity=".35"/>
 <circle cx="300" cy="155" r="108" fill="url(#shine)"/>
 <circle cx="215" cy="205" r="82" fill="url(#shine)" opacity=".7"/>
 <circle cx="375" cy="215" r="86" fill="url(#shine)" opacity=".55"/>
</g>
<ellipse cx="290" cy="215" rx="225" ry="72" fill="none" stroke="url(#ring)" stroke-width="5" filter="url(#glow)" transform="rotate(-10 290 215)"/>
<ellipse cx="292" cy="210" rx="170" ry="112" fill="none" stroke="#4fc8ff" stroke-width="3" stroke-opacity=".62" transform="rotate(17 292 210)"/>
<text x="290" y="250" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="104" font-weight="800" fill="#f5fbff" stroke="#99ddff" stroke-width="2" filter="url(#glow)">AI</text>
<g filter="url(#glow)">
 <ellipse cx="290" cy="335" rx="176" ry="43" fill="#0a0b2d" stroke="url(#base)" stroke-width="5"/>
 <ellipse cx="290" cy="332" rx="145" ry="28" fill="url(#base)" opacity=".24"/>
