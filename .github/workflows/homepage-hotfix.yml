name: Homepage hotfix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'Homepage hotfix') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Fix featured products
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old="const list=[real['chatgpt-plus'],real['claude-pro']].filter(Boolean);"
          new="const list=realIds.map(id=>real[id]).filter(Boolean);"
          if old not in s:
              raise SystemExit('target line not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit fix
        run: |
          git config user.name 'EVA AI MARKET Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Homepage hotfix: render all featured products'
          git push
      - name: Remove temporary workflow
        run: |
          git rm .github/workflows/homepage-hotfix.yml
          git commit -m 'Remove temporary homepage hotfix workflow'
          git push
