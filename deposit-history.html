<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#f8fbff"><title>充值历史｜EVA AI MARKET</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#edf5fb;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Arial,sans-serif;color:#10224b}body{display:flex;justify-content:center}.app{width:100%;max-width:430px;min-height:100svh;background:#fff;padding-bottom:76px}.top{height:52px;padding:7px 14px;display:flex;align-items:center;justify-content:center;position:relative;border-bottom:1px solid #eef3f8}.back{position:absolute;left:12px;border:0;background:#fff;font-size:24px;color:#17385d}.top b{font-size:15px}.summary{margin:12px;padding:13px;border:1px solid #dceafb;border-radius:13px;background:linear-gradient(135deg,#eaf6ff,#f7fbff)}.summary small{display:block;color:#71839a;font-size:9px}.summary strong{display:block;margin-top:4px;font-size:22px;color:#0ca468}.notice{margin:10px 12px;font-size:9px;color:#70839a}.list{margin:12px;display:grid;gap:8px}.row{border:1px solid #e3edf6;border-radius:12px;padding:11px;background:#fff}.head{display:flex;justify-content:space-between;gap:8px}.amount{font-size:13px;font-weight:950}.status{font-size:8px;padding:4px 7px;border-radius:10px;background:#eef5fb;color:#58718e}.status.approved{background:#ecfaf4;color:#149564}.status.rejected{background:#fff0f2;color:#d94b61}.meta{margin-top:7px;color:#7f8fa3;font-size:8px;line-height:1.6}.tx{margin-top:7px;padding:7px;border-radius:8px;background:#f7faff;border:1px solid #e7eef6;font:8px monospace;word-break:break-all;color:#314b6b}.note{margin-top:7px;color:#b46b00;font-size:8px}.empty{text-align:center;padding:45px 15px;color:#95a3b4;font-size:10px}.bottom{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:430px;height:64px;background:#fff;border-top:1px solid #e5edf6;display:flex;justify-content:space-around;align-items:center}.bottom a{color:#8796aa;text-decoration:none;font-size:9px;text-align:center}.bottom a.active{color:#087cf3;font-weight:900}.bottom span{display:block;font-size:18px;margin-bottom:2px}</style></head><body><main class="app"><header class="top"><button class="back" onclick="history.back()">‹</button><b>充值历史</b></header><section class="summary"><small>当前钱包余额</small><strong id="balance">US$ 0.00</strong></section><p class="notice" id="notice">仅显示当前登录账户的充值记录。</p><section class="list" id="list"><div class="empty">正在加载…</div></section><nav class="bottom"><a href="/"><span>⌂</span>首页</a><a href="/categories.html"><span>▦</span>分类</a><a href="/products.html"><span>🛒</span>产品</a><a href="/orders.html"><span>▤</span>订单</a><a class="active" href="/profile.html"><span>♙</span>我的</a></nav></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=v=>'$'+Number(v||0).toFixed(2);const labels={pending:'待验证',approved:'已通过',rejected:'已拒绝'};(async()=>{const list=document.getElementById('list'),notice=document.getElementById('notice');try{const c=await fetch('/api/config').then(r=>r.json());if(!c.url||!c.anonKey)throw Error('Account service unavailable.');const sb=supabase.createClient(c.url,c.anonKey,{auth:{persistSession:true,autoRefreshToken:true}});const {data:{session}}=await sb.auth.getSession();if(!session){location.replace('/login.html?next=/deposit-history.html');return}const [wallet,deposits]=await Promise.all([sb.from('wallets').select('balance_usd').eq('user_id',session.user.id).single(),sb.from('deposits').select('id,amount_usdt,network,transaction_id,status,admin_note,created_at,reviewed_at').eq('user_id',session.user.id).order('created_at',{ascending:false})]);if(wallet.error)throw wallet.error;if(deposits.error)throw deposits.error;document.getElementById('balance').textContent='US$ '+Number(wallet.data?.balance_usd||0).toFixed(2);if(!deposits.data?.length){list.innerHTML='<div class="empty">暂无充值记录。<br><br><a href="/deposit.html" style="color:#087cf3;text-decoration:none">去充值余额</a></div>';return}list.innerHTML=deposits.data.map(d=>'<article class="row"><div class="head"><span class="amount">US$ '+Number(d.amount_usdt||0).toFixed(2)+' · '+esc(d.network)+'</span><span class="status '+esc(d.status)+'">'+esc(labels[d.status]||d.status)+'</span></div><div class="meta">提交时间：'+new Date(d.created_at).toLocaleString()+(d.reviewed_at?' · 审核时间：'+new Date(d.reviewed_at).toLocaleString():'')+'</div><div class="tx">TXID: '+esc(d.transaction_id)+'</div>'+(d.admin_note?'<div class="note">审核备注：'+esc(d.admin_note)+'</div>':'')+'</article>').join('')}catch(e){notice.textContent='充值历史暂时无法加载：'+e.message;list.innerHTML='<div class="empty">请稍后重试。</div>'}})();</script></body></html>
