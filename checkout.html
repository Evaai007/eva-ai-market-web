<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#f8fbff">
<title>结算｜EVA AI MARKET</title>
<style>
:root{--blue:#1688ff;--navy:#0b2148;--red:#ff3150;--muted:#8190a5;--line:#e5edf6;--bg:#f7fbff}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#edf5fb;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Noto Sans SC",Arial,sans-serif;color:var(--navy);-webkit-font-smoothing:antialiased}
body{display:flex;justify-content:center}.app{width:100%;max-width:430px;min-height:100svh;background:#fff;padding-bottom:76px;box-shadow:0 0 42px rgba(26,83,145,.08)}
.top{height:50px;padding:calc(7px + env(safe-area-inset-top)) 12px 7px;display:flex;align-items:center;justify-content:center;position:relative;border-bottom:1px solid #eef3f8}.top button{position:absolute;left:10px;width:32px;height:32px;border:0;background:transparent;color:#17365e;font-size:23px}.top b{font-size:14px;font-weight:950}
.steps{display:flex;align-items:center;justify-content:center;gap:7px;padding:11px 15px 12px;border-bottom:7px solid #f7fbff}.step{display:flex;align-items:center;gap:5px;color:#9aa7b9;font-size:9px;font-weight:800}.step i{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;background:#eaf0f6;font-style:normal}.step.active{color:#087cf3}.step.active i{background:#087cf3;color:#fff}.line{width:38px;height:1px;background:#dce6ef}
.section{padding:12px 15px;border-bottom:7px solid #f7fbff}.section h2{margin:0 0 10px;font-size:11px;font-weight:950}
.product{display:grid;grid-template-columns:54px minmax(0,1fr) auto;gap:10px;align-items:center}.product-icon{width:52px;height:52px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(145deg,#5f73ff,#297dff);color:#fff;font-size:25px;font-weight:950}.product h3{margin:0 0 4px;font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.product .plan{font-size:8.5px;color:#8190a5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.product .price{font-size:13px;font-weight:950;color:#ff3150;white-space:nowrap}
.qty-row{display:flex;align-items:center;justify-content:space-between;margin-top:11px;padding-top:10px;border-top:1px solid #eaf0f6}.qty-row span{font-size:9.5px;color:#6f8097}.qty-box{display:flex;align-items:center;border:1px solid #e2ebf5;border-radius:9px;overflow:hidden}.qty-box button,.qty-box b{width:31px;height:29px;border:0;background:#fff;display:grid;place-items:center;color:#17365e;font-size:11px}.qty-box button{color:#9aa7b9}.qty-box b{border-left:1px solid #e9f0f6;border-right:1px solid #e9f0f6}
.coupon{display:flex;gap:7px}.coupon input{flex:1;min-width:0;height:38px;border:1px solid #dfe8f2;border-radius:10px;padding:0 11px;outline:0;color:#17365e;font-size:10px}.coupon button{width:80px;border:0;border-radius:10px;background:#eef7ff;color:#1680ee;font-size:9.5px;font-weight:900}
.payment-option{display:flex;align-items:center;min-height:45px;padding:9px 10px;border:1px solid #e2ebf5;border-radius:10px;background:#fff;margin-bottom:7px;cursor:pointer}.payment-option.active{border:2px solid #1688ff;background:#f4f9ff}.payment-option input{appearance:none;-webkit-appearance:none;width:18px;height:18px;border-radius:50%;border:1.5px solid #aac0d8;margin:0 10px 0 0;position:relative;flex:none}.payment-option input:checked{border-color:#1688ff;background:#1688ff}.payment-option input:checked:after{content:"";position:absolute;inset:4px;border-radius:50%;background:#fff}.pay-icon{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:#eef6ff;color:#1688ff;font-size:10px;font-weight:950;margin-right:9px}.payment-option span:last-child{font-size:10.5px;font-weight:850;color:#17365e}
.summary-line{display:flex;justify-content:space-between;align-items:center;margin:8px 0;font-size:10px;color:#718198}.summary-line strong{font-size:10.5px;color:#17365e}.summary-line.total{padding-top:10px;margin-top:10px;border-top:1px solid #e7eef7;color:#17365e;font-weight:950}.summary-line.total strong{font-size:19px;color:#ff3150}
.terms{display:flex;align-items:flex-start;gap:9px;margin:12px 0 13px;color:#718198;font-size:8.8px;line-height:1.45}.terms input{appearance:none;-webkit-appearance:none;width:17px;height:17px;border-radius:5px;border:1px solid #b7c8da;background:#fff;margin:0;flex:none;position:relative}.terms input:checked{background:#1688ff;border-color:#1688ff}.terms input:checked:after{content:"✓";position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-size:11px;font-weight:900}
#payNow{width:100%;height:44px;border:0;border-radius:12px;background:linear-gradient(180deg,#25aaff,#087cf3);color:#fff;font-size:12px;font-weight:950;box-shadow:0 6px 14px rgba(10,119,236,.22)}#payNow:disabled{opacity:.45;box-shadow:none}.notice{margin:0 15px 12px;padding:10px;border:1px solid #ffd2d9;border-radius:10px;background:#fff4f6;color:#d72f49;font-size:9px}
.trust{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;padding:10px 15px 14px}.trust div{min-height:51px;border:1px solid #e4edf6;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#78889d;font-size:8px}.trust b{font-size:15px;color:#1688ff;margin-bottom:3px}
.bottom{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:430px;height:68px;padding-bottom:env(safe-area-inset-bottom);z-index:40;background:rgba(255,255,255,.98);border-top:1px solid #e7eef7;display:grid;grid-template-columns:repeat(5,1fr);box-shadow:0 -6px 18px rgba(34,85,140,.05)}.bottom a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:#7e8ca0;text-decoration:none;font-size:9px}.bottom a.active{color:#1684ff;font-weight:900}.bottom span{font-size:18px}
@media(max-width:370px){.section{padding-left:11px;padding-right:11px}.product{grid-template-columns:48px minmax(0,1fr) auto}.product-icon{width:46px;height:46px}.coupon button{width:72px}}
</style>
</head>
<body data-page="checkout">
<main class="app" id="checkout">
<div class="top"><button onclick="history.back()" aria-label="Back">‹</button><b>确认订单</b></div>
<div class="steps"><span class="step"><i>1</i>购物车</span><i class="line"></i><span class="step active"><i>2</i>确认</span><i class="line"></i><span class="step"><i>3</i>支付</span></div>
<section class="section">
<h2>商品信息</h2>
<div class="product"><div class="product-icon" id="coLogo">AI</div><div><h3 id="coName">Loading product…</h3><div class="plan" id="coPlan"></div></div><div class="price" id="coPrice"></div></div>
<div class="qty-row"><span>数量</span><div class="qty-box"><button type="button" disabled>−</button><b>1</b><button type="button" disabled>＋</button></div></div>
</section>
<section class="section"><h2>优惠码</h2><div class="coupon"><input id="couponCode" placeholder="输入优惠码（可选）"><button type="button" id="couponBtn">使用</button></div></section>
<section class="section"><h2>支付方式</h2><label class="payment-option active"><input type="radio" checked name="payment" value="Wallet Balance"><span class="pay-icon">$</span><span>Wallet Balance · USDT</span></label></section>
<section class="section"><h2>订单金额</h2><div class="summary-line"><span>商品小计</span><strong id="coSubtotal"></strong></div><div class="summary-line"><span>优惠</span><strong>$0.00</strong></div><div class="summary-line total"><span>应付总额</span><strong id="coTotal"></strong></div><label class="terms"><input type="checkbox" id="agreeTerms"><span>我已确认商品信息，并同意 Terms &amp; Conditions。</span></label><button id="payNow" disabled>Pay from Wallet</button></section>
<p class="notice" id="checkoutNotice" hidden></p><div class="trust"><div><b>▣</b>安全支付</div><div><b>ϟ</b>快速处理</div><div><b>◇</b>可靠交付</div></div>
</main>
<nav class="bottom"><a href="/"><span>⌂</span>首页</a><a href="/categories.html"><span>▦</span>分类</a><a class="active" href="/products.html"><span>▦</span>产品</a><a href="/orders.html"><span>▤</span>订单</a><a href="/profile.html"><span>♙</span>我的</a></nav>
<script>
document.getElementById('couponBtn').addEventListener('click',()=>{const n=document.getElementById('checkoutNotice');const v=document.getElementById('couponCode').value.trim();if(!v){n.textContent='请输入优惠码。';n.hidden=false;return}n.textContent='当前未应用任何优惠；商品价格保持不变。';n.hidden=false;});
</script>
<script src="/eva-mobile-flow.js?v=20260921-runtime4"></script>
</body>
</html>
