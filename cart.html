<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>购物车｜EVA AI MARKET</title>
<style>:root{--b:#1688ff;--n:#0b2148;--m:#8190a5;--l:#e5edf6;--r:#ff3150}*{box-sizing:border-box}body{margin:0;background:#edf5fb;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Arial;color:var(--n)}main{max-width:430px;min-height:100svh;margin:auto;background:#fff;padding-bottom:145px}.top{height:52px;display:flex;align-items:center;justify-content:center;border-bottom:1px solid #eef3f8}.top b{font-size:14px}.wrap{padding:14px}.item{border:1px solid var(--l);border-radius:14px;padding:12px;display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;margin-bottom:9px}.icon{width:44px;height:44px;border-radius:12px;background:#eef7ff;display:grid;place-items:center;color:var(--b);font-weight:900}.name{font-size:11px;font-weight:900}.meta{font-size:8.5px;color:var(--m);margin-top:4px}.price{font-size:12px;font-weight:950;color:var(--r)}.remove{border:0;background:none;color:#9aa7b9;font-size:9px;margin-top:5px;padding:0}.empty{text-align:center;padding:60px 20px;color:var(--m);font-size:11px}.empty a{color:var(--b);text-decoration:none}.summary{position:fixed;left:50%;bottom:68px;transform:translateX(-50%);width:100%;max-width:430px;background:#fff;border-top:1px solid #e7eef7;padding:11px 14px;display:flex;align-items:center;justify-content:space-between}.total{font-size:16px;font-weight:950;color:var(--r)}.checkout{height:40px;border:0;border-radius:10px;background:linear-gradient(180deg,#25aaff,#087cf3);color:#fff;padding:0 18px;font-weight:900}.bottom{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:430px;height:68px;background:#fff;border-top:1px solid #e7eef7;display:grid;grid-template-columns:repeat(5,1fr)}.bottom a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:#7e8ca0;text-decoration:none;font-size:9px}.bottom a.active{color:var(--b);font-weight:900}.bottom span{font-size:18px}</style></head>
<body><main><div class="top"><b>购物车</b></div><div class="wrap"><div id="list"></div></div></main>
<div class="summary"><div>合计 <span class="total" id="total">$0.00</span></div><button class="checkout" id="checkout" disabled>去结算</button></div>
<nav class="bottom"><a href="/"><span>⌂</span>首页</a><a href="/products.html"><span>▦</span>产品</a><a class="active" href="/cart.html"><span>🛒</span>购物车</a><a href="/orders.html"><span>▤</span>订单</a><a href="/profile.html"><span>♙</span>我的</a></nav>
<script>
const KEY='eva-cart-v1';const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const read=()=>{try{const x=JSON.parse(localStorage.getItem(KEY)||'[]');return Array.isArray(x)?x.filter(p=>p&&p.id):[]}catch{return[]}};const save=x=>localStorage.setItem(KEY,JSON.stringify(x));
function render(){const items=read(),list=document.getElementById('list'),total=items.reduce((s,p)=>s+Number(p.price_usd||0),0);document.getElementById('total').textContent='$'+total.toFixed(2);document.getElementById('checkout').disabled=!items.length;if(!items.length){list.innerHTML='<div class="empty">购物车为空。<br><br><a href="/products.html">去浏览真实产品</a></div>';return;}list.innerHTML=items.map(p=>'<article class="item"><div class="icon">AI</div><div><div class="name">'+esc(p.name)+'</div><div class="meta">'+esc(p.category||'')+' · 数量 1<br><button class="remove" data-id="'+esc(p.id)+'">移除</button></div></div><div class="price">$'+Number(p.price_usd||0).toFixed(2)+'</div></article>').join('');document.querySelectorAll('.remove').forEach(b=>b.onclick=()=>{save(read().filter(p=>String(p.id)!==String(b.dataset.id)));render()});}
document.getElementById('checkout').onclick=()=>{const items=read();if(!items.length)return;const p=items[0];sessionStorage.setItem('eva-checkout-product',JSON.stringify(p));location.href='/checkout.html?id='+encodeURIComponent(p.id)+'&from=cart';};render();
</script></body></html>
