<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>我的产品｜EVA AI MARKET</title>
<style>:root{--b:#1688ff;--n:#0b2148;--m:#8190a5;--l:#e5edf6}*{box-sizing:border-box}body{margin:0;background:#edf5fb;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Arial;color:var(--n)}main{max-width:430px;min-height:100svh;margin:auto;background:#fff;padding-bottom:78px}.top{height:52px;display:flex;align-items:center;justify-content:center;border-bottom:1px solid #eef3f8;position:relative}.top a{position:absolute;left:12px;text-decoration:none;color:var(--n);font-size:23px}.top b{font-size:14px}.wrap{padding:14px}.notice{padding:11px 12px;border:1px solid #dcecff;background:#f5faff;border-radius:11px;color:#6f8097;font-size:10px;margin-bottom:12px}.item{border:1px solid var(--l);border-radius:14px;padding:12px;margin-bottom:9px;display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center}.icon{width:44px;height:44px;border-radius:12px;background:#eef7ff;display:grid;place-items:center;color:var(--b);font-weight:900}.name{font-size:11px;font-weight:900}.meta{font-size:8.5px;color:var(--m);margin-top:4px;line-height:1.5}.status{font-size:8px;font-weight:900;color:#0ca468;background:#ecfbf4;border:1px solid #c9f1dd;padding:5px 7px;border-radius:9px}.status.pending{color:#b27600;background:#fff8e8;border-color:#ffe1a0}.empty{text-align:center;padding:50px 20px;color:var(--m);font-size:11px}.bottom{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:430px;height:68px;background:#fff;border-top:1px solid #e7eef7;display:grid;grid-template-columns:repeat(5,1fr)}.bottom a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:#7e8ca0;text-decoration:none;font-size:9px}.bottom a.active{color:var(--b);font-weight:900}.bottom span{font-size:18px}</style></head>
<body><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><main><div class="top"><a href="/dashboard.html">‹</a><b>我的产品</b></div><div class="wrap"><div class="notice">这里只显示当前账户真实订单产生的产品，不使用示例商品。</div><div id="list"><div class="empty">正在加载…</div></div></div></main>
<nav class="bottom"><a href="/"><span>⌂</span>首页</a><a href="/products.html"><span>▦</span>产品</a><a href="/cart.html"><span>🛒</span>购物车</a><a href="/orders.html"><span>▤</span>订单</a><a class="active" href="/dashboard.html"><span>♙</span>我的</a></nav>
<script>
(async()=>{const list=document.getElementById('list');try{const cfgR=await fetch('/api/config',{cache:'no-store'});const cfg=await cfgR.json();if(!cfgR.ok||!cfg.url||!cfg.anonKey)throw new Error('Authentication configuration unavailable');const client=window.supabase.createClient(cfg.url,cfg.anonKey,{auth:{persistSession:true,autoRefreshToken:true}});const {data:{session}}=await client.auth.getSession();if(!session){sessionStorage.setItem('eva-return-to','/my-products.html');location.href='/login.html';return;}const r=await fetch('/api/store?view=orders',{headers:{authorization:'Bearer '+session.access_token},cache:'no-store'});const b=await r.json();if(!r.ok)throw new Error(b.error||'加载失败');const orders=Array.isArray(b.orders)?b.orders:[];const owned=orders.filter(o=>['delivered','processing','approved'].includes(String(o.status||'').toLowerCase()));if(!owned.length){list.innerHTML='<div class="empty">暂无已购买产品。<br><br><a href="/products.html">去浏览产品</a></div>';return;}const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));list.innerHTML=owned.map(o=>{const pending=o.status!=='delivered';return '<article class="item"><div class="icon">AI</div><div><div class="name">'+esc(o.product_name)+'</div><div class="meta">Order: '+esc(o.id||'')+'<br>购买时间: '+esc(new Date(o.created_at).toLocaleString())+(o.delivery_details?'<br>交付: '+esc(o.delivery_details):'')+'</div></div><span class="status '+(pending?'pending':'')+'">'+(pending?'处理中':'已交付')+'</span></article>'}).join('');}catch(e){list.innerHTML='<div class="empty">'+String(e.message||'加载失败')+'</div>';}})();
</script>
</body></html>
