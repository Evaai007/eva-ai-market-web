<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>EVA — 5 Spider Live Demo</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020812}#site{position:fixed;inset:0;width:100%;height:100%;border:0}.spider{--c:#ff3030;position:fixed;left:0;top:0;width:92px;height:92px;z-index:2147483647;pointer-events:none;filter:drop-shadow(0 8px 8px #000) drop-shadow(0 0 7px var(--c));transform-origin:50% 50%;will-change:transform}.spider.s1{--c:#ff3030}.spider.s2{--c:#21d4ff;width:78px;height:78px}.spider.s3{--c:#57ff35;width:105px;height:105px}.spider.s4{--c:#c45cff;width:84px;height:84px}.spider.s5{--c:#ffc62e;width:96px;height:96px}.leg{transform-box:fill-box;transform-origin:center;animation:leg .34s ease-in-out infinite alternate}.r{animation-delay:-.17s}@keyframes leg{from{transform:rotate(-7deg)}to{transform:rotate(7deg)}}@media(max-width:600px){.spider{width:74px;height:74px}.spider.s2{width:64px;height:64px}.spider.s3{width:86px;height:86px}.spider.s4{width:68px;height:68px}.spider.s5{width:78px;height:78px}}@media(prefers-reduced-motion:reduce){.leg{animation-duration:.8s}}</style></head><body><iframe id="site" src="https://aicloudmarket.shop/?spider-demo=1" title="Current EVA AI MARKET"></iframe><div id="layer"></div><script>const svg=`<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg"><g fill="none" stroke="var(--c)" stroke-width="7" stroke-linecap="round"><path class="leg" d="M51 50 29 31 8 28"/><path class="leg r" d="M48 57 24 49 4 54"/><path class="leg" d="M49 64 24 72 7 89"/><path class="leg r" d="M54 70 34 91 27 112"/><path class="leg r" d="M69 50 91 31 112 28"/><path class="leg" d="M72 57 96 49 116 54"/><path class="leg r" d="M71 64 96 72 113 89"/><path class="leg" d="M66 70 86 91 93 112"/></g><g fill="#08090b" stroke="var(--c)" stroke-width="3"><ellipse cx="60" cy="70" rx="25" ry="29"/><ellipse cx="60" cy="43" rx="17" ry="16"/></g><path d="M47 65c8 5 18 5 26 0M48 74c8 5 16 5 24 0" stroke="var(--c)" opacity=".65" fill="none"/><g fill="var(--c)"><circle cx="53" cy="39" r="2.2"/><circle cx="59" cy="37" r="2.2"/><circle cx="67" cy="39" r="2.2"/><circle cx="56" cy="44" r="1.5"/><circle cx="64" cy="44" r="1.5"/></g><path d="M51 46 44 52M69 46l7 6" stroke="#050505" stroke-width="4" stroke-linecap="round"/><ellipse cx="54" cy="57" rx="7" ry="17" fill="var(--c)" opacity=".16"/></svg>`;const layer=document.getElementById('layer'),spiders=[];for(let i=0;i<5;i++){let e=document.createElement('div');e.className='spider s'+(i+1);e.innerHTML=svg;layer.appendChild(e);spiders.push({e,x:innerWidth*(.1+.18*i),y:innerHeight*(.12+.14*(i%3)),tx:0,ty:0,a:0,t:0,d:0,s:0})}function target(o){let m=55;o.tx=m+Math.random()*Math.max(1,innerWidth-m*2);o.ty=m+Math.random()*Math.max(1,innerHeight-m*2);let dx=o.tx-o.x,dy=o.ty-o.y;o.d=Math.hypot(dx,dy);o.s=22+Math.random()*24;o.a=Math.atan2(dy,dx)*180/Math.PI+90}spiders.forEach(target);let last=performance.now();function frame(now){let dt=Math.min(.04,(now-last)/1000);last=now;for(const o of spiders){let dx=o.tx-o.x,dy=o.ty-o.y,dist=Math.hypot(dx,dy);if(dist<10){target(o);continue}let step=Math.min(dist,o.s*dt);o.x+=dx/dist*step;o.y+=dy/dist*step;o.t+=dt;o.e.style.transform=`translate3d(${o.x-o.e.offsetWidth/2}px,${o.y-o.e.offsetHeight/2}px,0) rotate(${o.a}deg) scale(${1+Math.sin(o.t*8)*.025})`}requestAnimationFrame(frame)}requestAnimationFrame(frame);addEventListener('resize',()=>spiders.forEach(target));</script></body></html>
