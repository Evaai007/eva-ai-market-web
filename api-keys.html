<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f3f7fc">
<title>API 密钥｜EVA AI MARKET</title>
<link rel="stylesheet" href="/eva-chinese-market.css?v=20261013-cn4">
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#edf5fb;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Noto Sans SC",Arial,sans-serif;color:#102b50}
body{display:flex;justify-content:center}.api-app{width:100%;max-width:430px;min-height:100svh;background:#fff;padding-bottom:26px}
.top{height:56px;padding:0 15px;display:flex;align-items:center;gap:12px;border-bottom:1px solid #e7eef7}.top a{color:#17365e;text-decoration:none;font-size:22px}.top b{font-size:15px}
.hero{margin:16px 14px;padding:18px;border-radius:18px;background:linear-gradient(135deg,#0a2c63,#1267db 65%,#3a8cff);color:#fff;box-shadow:0 12px 26px rgba(20,104,245,.2)}.hero .eyebrow{font-size:10px;opacity:.8;letter-spacing:.08em}.hero h1{font-size:22px;margin:7px 0}.hero p{font-size:12px;line-height:1.6;margin:0;opacity:.88}
.panel{margin:12px 14px;padding:16px;border:1px solid #e3ebf6;border-radius:16px;background:#fff;box-shadow:0 5px 18px rgba(12,47,94,.045)}.panel h2{font-size:14px;margin:0 0 8px}.panel p{font-size:11px;line-height:1.6;color:#7487a2;margin:0 0 12px}
.field{display:block;font-size:11px;font-weight:800;margin:12px 0 6px}.panel input{width:100%;height:44px;border:1px solid #dce6f2;border-radius:12px;padding:0 12px;font-size:16px;background:#fbfdff}
.btn{width:100%;min-height:44px;border:0;border-radius:12px;background:linear-gradient(180deg,#287dff,#0d5fea);color:#fff;font-weight:800;font-size:13px}.btn:disabled{opacity:.55}
.status{display:none;margin:12px 14px;padding:12px;border-radius:12px;font-size:12px;line-height:1.55;background:#edf5ff;color:#164c93;overflow-wrap:anywhere}.status.show{display:block}.status.error{background:#fff0f2;color:#b4233b}.secret{display:none;margin-top:12px}.secret.show{display:block}.secret code{display:block;padding:12px;border-radius:10px;background:#f1f6fc;color:#102b50;overflow-wrap:anywhere;font-size:12px;user-select:all}.warning{color:#a35e00!important;background:#fff7e5;border-radius:10px;padding:10px}
.links{display:flex;gap:9px;flex-wrap:wrap;margin:12px 14px}.links a{font-size:11px;text-decoration:none;color:#1468f5;padding:9px 12px;border:1px solid #dce9fc;border-radius:10px}
@media(min-width:768px){body{padding:24px}.api-app{max-width:620px;min-height:auto;border-radius:20px;overflow:hidden;box-shadow:0 18px 60px rgba(7,28,61,.10)}.hero{margin:20px 22px;padding:24px}.panel{margin:14px 22px;padding:22px}.links{margin:14px 22px}}
</style>
</head>
<body>
<main class="api-app">
<header class="top"><a href="/profile.html" aria-label="返回个人资料">‹</a><b>EVA AI MARKET · API</b></header>
<section class="hero"><div class="eyebrow">DEVELOPER CENTER</div><h1>API 密钥管理</h1><p>为您的账户签发新的私有 API 密钥。密钥仅在创建成功后显示一次，请立即复制并妥善保管。</p></section>
<div id="status" class="status" role="status" aria-live="polite"></div>
<section class="panel">
<h2>创建新密钥</h2><p>使用清晰的名称标识此密钥。密钥会通过现有安全 API 创建，并绑定到当前登录账户。</p>
<label class="field" for="keyName">密钥名称</label><input id="keyName" maxlength="60" value="My EVA API key" placeholder="例如：Production integration">
<button id="createKey" class="btn" style="margin-top:14px" type="button">安全创建 API 密钥</button>
<div id="secretPanel" class="secret"><p class="warning">请现在复制并保存。出于安全考虑，离开此页面后不会再次显示完整密钥。</p><code id="secretValue"></code><button id="copyKey" class="btn" style="margin-top:10px" type="button">复制密钥</button></div>
</section>
<section class="panel"><h2>安全提示</h2><p>不要将 API 密钥放进公开网页、前端代码或 GitHub 仓库。请将密钥保存在受保护的服务器环境变量中。如怀疑密钥泄露，请联系管理员处理。</p></section>
<nav class="links" aria-label="快捷导航"><a href="/dashboard.html">用户中心</a><a href="/api-docs.html">API 使用文档</a><a href="/profile.html">个人资料</a><a href="/products.html">产品市场</a></nav>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(async function(){
 const status=document.getElementById('status'), createButton=document.getElementById('createKey');
 let client,session;
 function show(message,error){status.textContent=message;status.className='status show'+(error?' error':'')}
 try{
  const response=await fetch('/api/config',{cache:'no-store'});
  const config=await response.json();
  if(!response.ok||!config.url||!config.anonKey)throw new Error(config.error||'Account service is unavailable.');
  client=window.supabase.createClient(config.url,config.anonKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
  const result=await client.auth.getSession();session=result.data.session;
  if(!session){location.replace('/login.html?next='+encodeURIComponent('/api-keys.html'));return}
  show('已安全登录：'+(session.user.email||'当前账户'));
 }catch(error){show(error.message||'无法连接账户服务，请稍后重试。',true);createButton.disabled=true;return}
 createButton.addEventListener('click',async()=>{
  const name=document.getElementById('keyName').value.trim().slice(0,60)||'My EVA API key';
  createButton.disabled=true;createButton.textContent='正在安全创建…';
  try{
   const current=await client.auth.getSession();session=current.data.session;
   if(!session)throw new Error('登录已过期，请重新登录。');
   const response=await fetch('/api/keys/create',{method:'POST',headers:{'content-type':'application/json','authorization':'Bearer '+session.access_token},body:JSON.stringify({name})});
   const result=await response.json().catch(()=>({}));
   if(!response.ok)throw new Error(result.error||'API 密钥创建失败。');
   document.getElementById('secretValue').textContent=result.apiKey||'';
   document.getElementById('secretPanel').classList.add('show');
   show('API 密钥已创建。请立即复制并安全保存；完整密钥不会再次显示。');
  }catch(error){show(error.message||'API 密钥创建失败。',true)}
  finally{createButton.disabled=false;createButton.textContent='创建另一个 API 密钥'}
 });
 document.getElementById('copyKey').addEventListener('click',async()=>{
  const value=document.getElementById('secretValue').textContent;
  try{await navigator.clipboard.writeText(value);show('密钥已复制到剪贴板。请不要分享给他人。')}
  catch(error){show('自动复制不可用。请长按上方密钥文本并手动复制。',true)}
 });
})();
</script>
</body></html>
