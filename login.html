<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#f8fbff">
<title>登录｜EVA AI MARKET</title>
<style>
:root{--blue:#1688ff;--navy:#0b2148;--muted:#8190a5;--line:#e4edf6;--bg:#f7fbff}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#edf5fb;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Noto Sans SC",Arial,sans-serif;color:var(--navy);-webkit-font-smoothing:antialiased}
body{display:flex;justify-content:center}.app{width:100%;max-width:430px;min-height:100svh;background:linear-gradient(180deg,#fbfdff,#f4f9fd 72%,#fff);padding:calc(20px + env(safe-area-inset-top)) 18px 28px;box-shadow:0 0 42px rgba(26,83,145,.08)}
.back{width:34px;height:34px;border:0;background:#fff;border-radius:10px;color:#17365e;font-size:22px;box-shadow:0 5px 14px rgba(35,89,146,.06)}
.brand{text-align:center;margin-top:18px}.logo{width:66px;height:66px;margin:0 auto 10px;display:grid;place-items:center}.logo svg{width:66px;height:66px}.brand h1{margin:0;font-size:21px;font-weight:950;letter-spacing:-.02em}.brand p{margin:6px 0 0;font-size:9.5px;color:#8190a5}
.card{margin-top:22px;background:#fff;border:1px solid #e4edf6;border-radius:18px;padding:18px 15px 16px;box-shadow:0 10px 28px rgba(35,89,146,.07)}
.card h2{margin:0;font-size:17px;font-weight:950}.card .lead{margin:5px 0 15px;font-size:9.5px;color:#8190a5}
.field{margin-bottom:12px}.field-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}.field label{font-size:9.5px;font-weight:900;color:#36506f}.field input{width:100%;height:43px;border:1px solid #dfe8f2;border-radius:11px;background:#fbfdff;padding:0 12px;outline:0;color:#17365e;font-size:11px}.field input:focus{border-color:#1688ff;box-shadow:0 0 0 3px rgba(22,136,255,.08)}.password-wrap{position:relative}.password-wrap input{padding-right:58px}.password-toggle{position:absolute;right:9px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:#1688ff;font-size:9px;font-weight:900}
#forgot-password{border:0;background:transparent;padding:0;color:#1688ff;font-size:8.8px;font-weight:850}
.submit{width:100%;height:44px;border:0;border-radius:12px;background:linear-gradient(180deg,#2baaff,#117df0);color:#fff;font-size:12px;font-weight:950;box-shadow:0 6px 14px rgba(10,119,236,.22);margin-top:3px}
.auth-status{min-height:18px;margin:11px 0 0;text-align:center;font-size:9px;color:#7e8da1}.auth-status.success{color:#0ca468}.auth-status.error{color:#e23a54}
.signup-link{text-align:center;margin-top:14px;font-size:9.5px;color:#7f8ea3}.signup-link a{color:#1688ff;text-decoration:none;font-weight:900}
.divider{display:flex;align-items:center;gap:8px;margin:16px 0;color:#a0acbb;font-size:8px}.divider:before,.divider:after{content:"";height:1px;background:#e7eef7;flex:1}
.safe{margin-top:12px;display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.safe div{height:50px;border:1px solid #e5edf6;border-radius:10px;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#7e8da1;font-size:7.5px}.safe b{color:#1688ff;font-size:14px;margin-bottom:2px}
.hidden-signup{display:none!important}
@media(max-width:370px){.app{padding-left:14px;padding-right:14px}.card{padding-left:13px;padding-right:13px}}
</style>
</head>
<body>
<main class="app">
<button class="back" onclick="history.back()" aria-label="Back">‹</button>

<section class="brand">
<div class="logo"><svg viewBox="0 0 64 64"><defs><linearGradient id="cg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#35b9ff"/><stop offset=".56" stop-color="#147fff"/><stop offset="1" stop-color="#065ce7"/></linearGradient></defs><path fill="url(#cg)" d="M11 18l9 7 7-14 6 14 12-10 5 26c-12 8-25 8-38 0z"/><path fill="#fff" opacity=".9" d="M16 31h32v4H16z"/><circle cx="11" cy="15" r="4" fill="#35b9ff"/><circle cx="28" cy="8" r="4" fill="#147fff"/><circle cx="47" cy="12" r="4" fill="#065ce7"/></svg></div>
<h1>EVA AI MARKET</h1>
<p>全球优质AI服务 · 一站式购买平台</p>
</section>

<section class="card">
<h2>欢迎回来</h2>
<p class="lead">登录您的 EVA AI MARKET 账户</p>

<form id="login-form" class="auth-form">
<div class="field">
<div class="field-head"><label for="login-email">邮箱地址</label></div>
<input type="email" id="login-email" autocomplete="email" inputmode="email" required placeholder="you@example.com">
</div>

<div class="field">
<div class="field-head"><label for="login-password">密码</label><button id="forgot-password" type="button">忘记密码？</button></div>
<div class="password-wrap">
<input type="password" id="login-password" autocomplete="current-password" minlength="8" required placeholder="请输入密码">
<button class="password-toggle" type="button" data-toggle-password="login-password" aria-pressed="false">Show</button>
</div>
</div>

<button class="submit" type="submit">登录</button>
</form>

<p id="auth-status" class="auth-status" role="status" aria-live="polite"></p>

<div class="signup-link">还没有账户？ <a href="/signup.html">立即注册</a></div>
<div class="divider">安全登录</div>
<div class="safe"><div><b>▣</b>加密保护</div><div><b>ϟ</b>快速访问</div><div><b>◇</b>账户安全</div></div>
</section>

<form id="signup-form" class="auth-form hidden-signup" hidden>
<input type="email" id="signup-email" autocomplete="email">
<input type="password" id="signup-password" autocomplete="new-password" minlength="8">
<button type="submit">Create Account</button>
</form>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/auth.js?v=20260918-password1"></script>
<script src="/speed-insights-init.js" defer></script>
</body>
</html>
